name: Java CI with Gradle

on:
  push:
    branches: [ "main", "feature/**", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build and Test with Gradle
      run: ./gradlew build jacocoTestReport

    - name: Upload Project Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: project-artifacts
        path: build/

  code-analysis:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Project Artifacts
      uses: actions/download-artifact@v4
      with:
        name: project-artifacts
        path: build/

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Run JaCoCo Coverage Verification
      run: ./gradlew test jacocoTestCoverageVerification

    - name: Analyze with SonarCloud and Wait for Quality Gate
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: >
        ./gradlew sonar --info -Dsonar.qualitygate.wait=true

  docker-build:
    runs-on: ubuntu-latest
    needs: code-analysis
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Project Artifacts
      uses: actions/download-artifact@v4
      with:
        name: project-artifacts
        path: build/

    - name: Set up Docker Tags
      run: |
        LOW_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_BASE="ghcr.io/$LOW_REPO/user-service"
        
        echo "IMAGE_TAG_SHA=${IMAGE_BASE}:${{ github.sha }}" >> $GITHUB_ENV
        echo "IMAGE_TAG_LATEST=${IMAGE_BASE}:latest" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_TAG_SHA }}
          ${{ env.IMAGE_TAG_LATEST }}